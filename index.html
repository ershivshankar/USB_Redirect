<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal USB Device Bridge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="minimal-wrapper">
        <!-- Brand & Status -->
        <header class="minimal-header">
            <div class="brand-title">
                <span class="spark">⚡</span> USB Device Bridge
            </div>
            <div class="server-indicator" id="serverIndicator">
                <span class="status-dot"></span>
                <span id="serverIndicatorText">Connecting to server...</span>
            </div>
        </header>

        <!-- Main Connect Stage -->
        <main class="connect-stage">
            <div class="circle-container">
                <div class="pulse-ring" id="pulseRing"></div>
                <button class="circle-btn" id="btnCircleConnect">
                    <div class="btn-inner">
                        <div class="icon-wrap" id="btnIcon">🔌</div>
                        <div class="btn-text" id="btnMainText">CONNECT</div>
                        <div class="btn-subtext" id="btnSubText">Click to pair phone</div>
                    </div>
                </button>
            </div>

            <!-- Simple Live Status -->
            <div class="status-card" id="statusCard">
                <div class="status-heading" id="statusHeading">Ready to Connect</div>
                <div class="status-description" id="statusDesc">
                    Plug your phone in EDL, BROM, Fastboot or Download mode, then click the button above.
                </div>

                <!-- Device Info (Revealed on connect) -->
                <div class="device-badge hidden" id="deviceBadge">
                    <div class="device-icon">📱</div>
                    <div class="device-meta">
                        <div class="device-name" id="badgeDevName">Unknown Device</div>
                        <div class="device-sub" id="badgeDevSub">VID: 0x0000 | PID: 0x0000</div>
                    </div>
                    <div class="live-pill">LIVE</div>
                </div>
            </div>
        </main>

        <!-- Minimal Footer -->
        <footer class="minimal-footer">
            <span>Supported: Chrome, Edge, Brave, Opera</span>
        </footer>
    </div>

    <!-- Hidden configuration input for auto-detection -->
    <input type="hidden" id="serverUrl" value="">
    <input type="hidden" id="sessionId" value="GLOBAL-CLIENT">

    <script src="app.js"></script>
</body>
</html>
